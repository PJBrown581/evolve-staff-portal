<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'; manifest-src 'self'">

<!-- Framing: GitHub Pages cannot send X-Frame-Options or a CSP frame-ancestors header, and browsers ignore
     frame-ancestors in a <meta> CSP. So the page starts hidden (html.fb-wait) and app.js shows it only when it is
     the top window; if framed it stays blank and tries to break out. This stops clickjacking in browsers with JS on;
     the real fix is serving it from a host that can send headers (e.g. evolvegvl.com behind a proxy/CDN). -->
</head>
<body class="portal">
<div class="sandbox">SANDBOX - test version. Nothing is texted or emailed.</div>
<header>
  <h1 class="brand has-lockup" aria-label="Work Exchange at Evolve - Staff schedule">
    <img class="brand-lockup" src="img/ee_header_lockup.png" srcset="img/ee_header_lockup.png 1x, img/ee_header_lockup@2x.png 2x" width="600" height="120" alt="">
    <span class="brand-compact" aria-hidden="true">
      <span class="brand-evolve"><img class="brand-logo" src="img/evolve_logo_cream_400.png" alt=""></span><span class="brand-rule"></span>
      <span class="brand-sub"><span class="brand-ee">Work Exchange<svg class="brand-bolt" viewBox="0 0 12 18" aria-hidden="true"><path d="M7.5 0 0 10.2h4.6L3.6 18 12 7.2H7.2z" fill="#cdf549"/></svg></span><span class="brand-at">at Evolve</span></span>
    </span>
  </h1>
  <span class="who" id="who"></span>
</header>
<div id="offline" class="offline hide">You look offline. Your schedule will load when you reconnect.</div>
<nav id="nav"></nav>
<main id="main"><div class="empty">Loading...</div></main>
<noscript><div>This page needs JavaScript turned on to show your schedule.</div></noscript>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
